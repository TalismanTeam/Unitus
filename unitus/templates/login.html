{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unitas - Login</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <div class="auth-wrapper">
        {% if messages %}
            <div class="messages-container">
                {% for message in messages %}
                    <p class="{{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <div class="auth-card">
            <h2>Welcome Back</h2>
            <form method="POST" action="{% url 'accounts:login' %}">
                {% csrf_token %}
                <div style="margin-bottom: 16px;">
                    <label for="id_identifier">Username or Email</label>
                    <input type="text" id="id_identifier" name="identifier" placeholder="Enter your username or email" required>
                </div>
                <div style="margin-bottom: 20px;">
                    <label for="id_password">Password</label>
                    <input type="password" id="id_password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit">Login</button>
            </form>
        </div>

        <div class="auth-switch">
            <p>Don't have an account? <a href="{% url 'accounts:register' %}">Register</a></p>
        </div>
    </div>
</body>
</html>
