<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>Unitas - Project Management</title>
</head>

<body>

  <div class="container">

    <!-- Navigation -->
    <nav>
      <a href="index.html">Home</a>
      <a href="auth.html">Auth</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="projects.html" class="active">Projects</a>
      <a href="project_advertisements.html">Advertisements</a>
      <a href="settings.html">Settings</a>
    </nav>


    <!-- Page Header -->
    <div class="page-header">

      <h2>مدیریت پروژه‌ها</h2>

      <!-- PM-001: Create Project -->
      <button type="button">
        ایجاد پروژه جدید
      </button>

    </div>


    <!-- Project List -->
    <div id="project-list">


      <!-- Project Item -->
      <div class="list-item">

        <!-- PM-002: View Project -->
        <h3>
          عنوان پروژه
        </h3>

        <p>
          توضیحات پروژه
        </p>


        <!-- PM-004: Project Status -->
        <p>
          <strong>وضعیت پروژه:</strong>
          وضعیت
        </p>


        <!-- PM-006: Project Visibility -->
        <p>
          <strong>قابلیت مشاهده:</strong>
          عمومی / خصوصی
        </p>


        <!-- PM-007: Project Ownership -->
        <p>
          <strong>مالک پروژه:</strong>
          نام مالک
        </p>


        <!-- Project Actions -->
        <div class="project-actions">

          <!-- PM-002: View Project -->
          <button type="button">
            مشاهده پروژه
          </button>

          <!-- PM-003: Edit Project -->
          <button type="button">
            ویرایش پروژه
          </button>

          <!-- PM-005: Archive / Close Project -->
          <button type="button">
            بستن / آرشیو پروژه
          </button>

          <!-- PM-008: Delete Project -->
          <button type="button">
            حذف پروژه
          </button>

        </div>

      </div>


      <!-- Another Project Item -->
      <div class="list-item">

        <h3>
          عنوان پروژه
        </h3>

        <p>
          توضیحات پروژه
        </p>

        <p>
          <strong>وضعیت پروژه:</strong>
          وضعیت
        </p>

        <p>
          <strong>قابلیت مشاهده:</strong>
          عمومی / خصوصی
        </p>

        <p>
          <strong>مالک پروژه:</strong>
          نام مالک
        </p>

        <div class="project-actions">

          <button type="button">
            مشاهده پروژه
          </button>

          <button type="button">
            ویرایش پروژه
          </button>

          <button type="button">
            بستن / آرشیو پروژه
          </button>

          <button type="button">
            حذف پروژه
          </button>

        </div>

      </div>


    </div>

  </div>
