{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/search.css' %}">
    <title>Unitus - Search &amp; Discovery</title>
</head>
<body>
<div class="container" style="max-width: 1000px;">
    <nav>
      <a href="{% url 'accounts:profile-page' %}" >Profile</a>  
      <a href="{% url 'projects:home' %}">Projects</a>
      <a href="{% url 'search:search_page' %}"class="active">Search</a>
      <a href="{% url 'collaboration:ticket-management' %}">Tickets</a>
      <a href="{% url 'chat:inbox' %}">Chat</a>

      <form action="{% url 'accounts:logout' %}" method="POST" style="display: inline; background: transparent; padding: 0; border: none; box-shadow: none; margin-left: auto;">
        {% csrf_token %}
        <button type="submit" style="background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500;">Logout</button>
      </form>

      <!-- <a href="notification.html">Notifications</a>
      <a href="project_advertisements.html">Advertisements</a>
      <a href="{% url 'home' %}">Home</a>
      <a href="settings.html">Settings</a>
      <a href="matching.html">Matchmaking</a> -->

    </nav>

    <div id="searchPageRoot">

        <!-- =================== JOB ADS SEARCH =================== -->
        <section class="search-module">
            <div class="search-module-header">
                <span class="search-module-icon">📄</span>
                <h2>Search Job Ads</h2>
            </div>

            <div class="search-bar-row">
                <input type="text" id="adsSearchInput" placeholder="Search by project, role, or keyword...">
                <button type="button" class="filter-toggle-btn" id="adsFilterToggleBtn">Filters</button>
            </div>

            <div class="filter-panel" id="adsFilterPanel">
                <div class="filter-field">
                    <label>Skill</label>
                    <select id="adsSkillSelect"></select>
                </div>
                <div class="filter-field">
                    <label>Minimum required level</label>
                    <select id="adsLevelSelect"><option value="">Any level</option></select>
                </div>
                <div class="filter-field">
                    <label>Min duration (days)</label>
                    <input type="number" id="adsDurationMin" min="0" placeholder="e.g. 30">
                </div>
                <div class="filter-field">
                    <label>Max duration (days)</label>
                    <input type="number" id="adsDurationMax" min="0" placeholder="e.g. 90">
                </div>
                <div class="filter-field">
                    <label>Sort by</label>
                    <select id="adsSortSelect">
                        <option value="newest">Newest</option>
                        <option value="oldest">Oldest</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button type="button" id="adsApplyBtn">Apply Filters</button>
                    <button type="button" id="adsClearBtn" class="secondary-btn">Clear Filters</button>
                </div>
            </div>

            <div class="category-chips" id="adsCategoryChips"></div>

            <div class="result-grid" id="adsResultsGrid">
                <div class="loading-state">Loading...</div>
            </div>
            <div class="pagination-controls" id="adsPagination"></div>
        </section>

        <!-- =================== USERS SEARCH =================== -->
        <section class="search-module">
            <div class="search-module-header">
                <span class="search-module-icon">👥</span>
                <h2>Search Users</h2>
            </div>

            <div class="search-bar-row">
                <input type="text" id="usersSearchInput" placeholder="Search by name or username...">
                <button type="button" class="filter-toggle-btn" id="usersFilterToggleBtn">Filters</button>
            </div>

            <div class="filter-panel" id="usersFilterPanel">
                <div class="filter-field">
                    <label>Skill</label>
                    <select id="usersSkillSelect"></select>
                </div>
                <div class="filter-field">
                    <label>Mastery level</label>
                    <select id="usersLevelSelect"><option value="">Any level</option></select>
                </div>
                <div class="filter-field">
                    <label>Location</label>
                    <input type="text" id="usersLocationInput" placeholder="e.g. Tehran">
                </div>
                <div class="filter-field-check">
                    <input type="checkbox" id="usersOpenToWorkCheckbox">
                    <label for="usersOpenToWorkCheckbox">Open to work only</label>
                </div>
                <div class="filter-field">
                    <label>Sort by</label>
                    <select id="usersSortSelect">
                        <option value="name_asc">Name A–Z</option>
                        <option value="name_desc">Name Z–A</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button type="button" id="usersApplyBtn">Apply Filters</button>
                    <button type="button" id="usersClearBtn" class="secondary-btn">Clear Filters</button>
                </div>
            </div>

            <div class="category-chips" id="usersCategoryChips"></div>

            <div class="result-grid" id="usersResultsGrid">
                <div class="loading-state">Loading...</div>
            </div>
            <div class="pagination-controls" id="usersPagination"></div>
        </section>

    </div>
</div>
<script src="{% static 'js/search.js' %}"></script>
</body>
</html>
