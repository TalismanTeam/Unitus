{% load static %}
<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unitas - My Projects</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  </head>
  <body>
    <div class="container">
      <nav>
        <a href="{% url 'accounts:profile-page' %}" class="active">Profile</a>
        <a href="{% url 'projects:home' %}">Projects</a>
        <a href="{% url 'search:search_page' %}">Search</a>
        <a href="{% url 'collaboration:ticket-management' %}">Tickets</a>
        <a href="{% url 'chat:inbox' %}">Chat</a>

        <form
          action="{% url 'accounts:logout' %}"
          method="POST"
          style="
            display: inline;
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
            margin-left: auto;
          "
        >
          {% csrf_token %}
          <button
            type="submit"
            style="
              background: transparent;
              color: #ef4444;
              border: 1px solid #ef4444;
              padding: 6px 12px;
              border-radius: 6px;
              cursor: pointer;
              font-size: 14px;
              font-weight: 500;
            "
          >
            Logout
          </button>
        </form>

        <!-- <a href="notification.html">Notifications</a>
      <a href="project_advertisements.html">Advertisements</a>
      <a href="{% url 'home' %}">Home</a>
      <a href="settings.html">Settings</a>
      <a href="matching.html">Matchmaking</a> -->
      </nav>

      <main>
        <h1>My Projects</h1>

        <div class="tabs">
          <button class="tab-btn active" data-tab="in_progress">
            In Progress
          </button>
          <button class="tab-btn" data-tab="suspended">Suspended</button>
          <button class="tab-btn" data-tab="completed">
            Completed/Terminated
          </button>
          <button class="tab-btn" data-tab="managed">
            My Managed Projects
          </button>
          <button class="tab-btn" data-tab="all">All</button>
        </div>

        <div class="tab-content">
          <h2 id="tab-content-heading">In Progress Projects</h2>
          <p id="project-list-status" style="display: none"></p>
          <ul id="project-list">
            <!-- Populated by dashboard.js from
                         GET /auth/users/me/dashboard/projects?tab=... -->
          </ul>
        </div>

        <section class="activity-tracker" style="margin-top: 2rem">
          <h2>Recent Activity</h2>
          <ul>
            <li>You joined "Project Alpha" 2 days ago.</li>
            <li>You updated your profile skills.</li>
          </ul>
        </section>
      </main>
    </div>
    <script src="{% static 'js/dashboard.js' %}"></script>
  </body>
</html>
