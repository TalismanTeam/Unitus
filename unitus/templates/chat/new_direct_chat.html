{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/chat.css' %}">
    <title>Unitus - Chat with {{ other_user.username }}</title>
</head>
<body>
<div class="container">

        <nav>
      <a href="{% url 'accounts:profile-page' %}" class="active">Profile</a>  
      <a href="{% url 'projects:home' %}">Projects</a>
      <a href="{% url 'search:search_page' %}">Search</a>
      <a href="ticketManagement.html">Tickets</a>
      <a href="{% url 'chat:inbox' %}">Chat</a>

      <form action="{% url 'accounts:logout' %}" method="POST" style="display: inline; background: transparent; padding: 0; border: none; box-shadow: none; margin-left: auto;">
        {% csrf_token %}
        <button type="submit" style="background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500;">Logout</button>
      </form>

      <!-- <a href="notification.html">Notifications</a>
      <a href="project_advertisements.html">Advertisements</a>
      <a href="{% url 'home' %}">Home</a>
      <a href="settings.html">Settings</a>
      <a href="matching.html">Matchmaking</a> -->

    </nav>

    <div class="layout-grid">
        {% include 'chat/_sidebar.html' %}

        <main class="chat-window">
            <div class="chat-header"><h3>{{ other_user.username }}</h3></div>

            <div class="chat-history" id="chatHistory"
                 data-mode="new-direct"
                 data-ws-path="{{ websocket_path }}"
                 data-current-user-id="{{ request.user.id }}">
                <p class="empty-hint">This is the beginning of your conversation with {{ other_user.username }}.</p>
            </div>

            <form class="chat-input-area" id="chatInputArea">
                <textarea id="chatInput" placeholder="Type your first message..." autocomplete="off" rows="1"></textarea>
                <button type="submit" id="chatSendBtn">Send</button>
            </form>
        </main>
    </div>
</div>
<script src="{% static 'js/chat.js' %}"></script>
</body>
</html>
