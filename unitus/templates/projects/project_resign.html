{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta charset="UTF-8"><link rel="stylesheet" href="{% static 'css/styles.css' %}"><title>Unitas - Resign</title></head>
<body>
  <div class="container">
    <nav>
      <a href="{% url 'accounts:profile-page' %}">Profile</a>
      <a href="{% url 'projects:home' %}" class="active">Projects</a>
      <a href="{% url 'search:search_page' %}">Search</a>
      <a href="ticketManagement.html">Tickets</a>
      <a href="{% url 'chat:inbox' %}">Chat</a>
    </nav>

    <h2>Resign from "{{ project.title }}"?</h2>

    <form method="POST" novalidate>
      {% csrf_token %}
      <label for="{{ form.reason.id_for_label }}">{{ form.reason.label }}</label>
      {{ form.reason }}
      {% if form.reason.errors %}<p style="color:#ef4444;">{{ form.reason.errors }}</p>{% endif %}

      <button type="submit" style="background:#ef4444;">Confirm Resignation</button>
      <a href="{% url 'projects:project_workspace' project.pk %}" class="secondary-btn">Cancel</a>
    </form>
  </div>
</body>
</html>
