{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta charset="UTF-8"><link rel="stylesheet" href="{% static 'css/styles.css' %}"><title>Unitas - Remove Member</title></head>
<body>
  <div class="container">
    <nav>
      <a href="{% url 'accounts:profile-page' %}">Profile</a>
      <a href="{% url 'projects:home' %}" class="active">Projects</a>
      <a href="{% url 'search:search_page' %}">Search</a>
      <a href="{% url 'collaboration:ticket-management' %}">Tickets</a>
      <a href="{% url 'chat:inbox' %}">Chat</a>
    </nav>

    <h2>Remove {{ member.user.username }} from "{{ project.title }}"?</h2>
    <p class="hint">If they had a role, its job ad will reopen automatically (unless the project has left Recruiting).</p>

    <form method="POST">
      {% csrf_token %}
      <button type="submit" style="background:#ef4444;">Yes, remove them</button>
      <a href="{% url 'projects:project_workspace' project.pk %}" class="secondary-btn">Cancel</a>
    </form>
  </div>
</body>
</html>
