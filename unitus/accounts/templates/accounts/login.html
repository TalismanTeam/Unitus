<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Unitus</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .btn-submit:hover { background-color: #0056b3; }
        .messages { list-style: none; padding: 0; margin-bottom: 20px; }
        .messages li { padding: 10px; border-radius: 4px; margin-bottom: 5px; font-size: 14px; }
        .messages .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .messages .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Sign In to Unitus</h2>

    
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="post" action="{% url 'accounts:login' %}">
         
        {% csrf_token %}

         
        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

         
        <div class="form-group">
            <label for="id_identifier">{{ form.identifier.label }}</label>
            {{ form.identifier }}
        </div>

         
        <div class="form-group">
            <label for="id_password">{{ form.password.label }}</label>
            {{ form.password }}
        </div>

        <button type="submit" class="btn-submit">Login</button>
    </form>
    
    <p style="margin-top: 15px; font-size: 14px; text-align: center;">
        Don't have an account? <a href="{% url 'accounts:register' %}">Register here</a>
    </p>
</div>

</body>
</html>
