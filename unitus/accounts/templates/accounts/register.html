<!DOCTYPE html>
<html>
<head><title>Test Register</title></head>
<body>
    <h2>Registration</h2>
    
    {% if messages %}
        {% for message in messages %}
            <p style="color: red;">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}  
        <button type="submit">submit</button>
    </form>
</body>
</html>
