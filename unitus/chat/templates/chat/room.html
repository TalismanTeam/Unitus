<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Chat Room</title></head>
<body>

<div id="message-list">
    {% for message in messages %}
        <div class="message">
            <strong>{{ message.sender.username }}</strong>: {{ message.content }}
            <span class="time">{{ message.sent_at }}</span>
        </div>
    {% endfor %}
</div>

{% if not room.is_closed %}
<form id="message-form">
    <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
    <button type="submit">Send</button>
</form>
{% else %}
<p>This project has ended. This conversation is now read-only.</p>
{% endif %}

<script>
    const roomId = Number("{{ room.id }}");
    const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(`${wsScheme}://${window.location.host}{{ websocket_path }}`);
    const messageList = document.getElementById("message-list");

    // Built with textContent (NOT innerHTML) to prevent XSS from message content.
    function appendMessage(data) {
        const div = document.createElement("div");
        div.className = "message";

        const strong = document.createElement("strong");
        strong.textContent = data.sender_username;
        div.appendChild(strong);
        div.appendChild(document.createTextNode(": " + data.content + " "));

        const span = document.createElement("span");
        span.className = "time";
        span.textContent = data.sent_at;
        div.appendChild(span);

        messageList.appendChild(div);
        messageList.scrollTop = messageList.scrollHeight;
    }

    socket.onmessage = function (event) {
        appendMessage(JSON.parse(event.data));
    };

    const form = document.getElementById("message-form");
    if (form) {
        form.addEventListener("submit", function (e) {
            e.preventDefault();
            const input = document.getElementById("message-input");
            const content = input.value.trim();
            if (!content) return;
            socket.send(JSON.stringify({ content: content }));
            input.value = "";
        });
    }
</script>

</body>
</html>
