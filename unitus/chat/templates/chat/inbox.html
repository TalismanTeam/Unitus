<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Chats</title></head>
<body>
<h1>Your Conversations</h1>
<div class="conversation-list">
    {% for conv in conversations %}
        <a href="{% url 'chat:room' conv.room_id %}" class="conversation-item">
            <strong>{{ conv.display_name }}</strong>
            <p>{{ conv.last_message_content|truncatechars:50 }}</p>
            {% if conv.unread_count > 0 %}
                <span class="unread-badge">{{ conv.unread_count }}</span>
            {% endif %}
            {% if conv.is_closed %}<span class="closed-badge">Closed</span>{% endif %}
        </a>
    {% empty %}
        <p>No conversations yet.</p>
    {% endfor %}
</div>
</body>
</html>
