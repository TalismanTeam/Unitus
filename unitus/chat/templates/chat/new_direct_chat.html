<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Chat with {{ other_user.username }}</title></head>
<body>

<h2>Chat with {{ other_user.username }}</h2>
<div id="message-list"></div>

<form id="message-form">
    <input type="text" id="message-input" placeholder="Type your first message..." autocomplete="off">
    <button type="submit">Send</button>
</form>

<script>
    const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(`${wsScheme}://${window.location.host}{{ websocket_path }}`);
    const messageList = document.getElementById("message-list");
    let redirected = false;

    function appendMessage(data) {
        const div = document.createElement("div");
        const strong = document.createElement("strong");
        strong.textContent = data.sender_username;
        div.appendChild(strong);
        div.appendChild(document.createTextNode(": " + data.content));
        messageList.appendChild(div);
    }

    socket.onmessage = function (event) {
        const data = JSON.parse(event.data);
        appendMessage(data);

        if (!redirected && data.room_id) {
            redirected = true;
            window.location.href = "/chat/room/" + data.room_id + "/";
        }
    };

    document.getElementById("message-form").addEventListener("submit", function (e) {
        e.preventDefault();
        const input = document.getElementById("message-input");
        const content = input.value.trim();
        if (!content) return;
        socket.send(JSON.stringify({ content: content }));
        input.value = "";
    });
</script>

</body>
</html>
